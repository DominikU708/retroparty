<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonLyrics Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #050505; color: #fff; display: flex; justify-content: center; min-height: 100vh; padding: 40px 20px; }
        .admin-card { background: rgba(20,20,25,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; width: 100%; max-width: 600px; }
        h1 { font-size: 2rem; margin-bottom: 20px; color: #00ffff; text-align: center; }
        
        /* ÚJ: ADMIN SZAVAZÁS DOBOZ */
        .admin-vote-box { background: rgba(0, 255, 128, 0.1); border: 2px dashed #00ff80; border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 30px; }
        .start-vote-btn { background: #00ff80; color: #000; border: none; padding: 15px 25px; font-weight: 800; border-radius: 10px; cursor: pointer; font-size: 1rem; width: 100%; transition: 0.2s; }
        .start-vote-btn:hover { background: #fff; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        input, textarea, select { width: 100%; padding: 15px; background: #111; border: 1px solid #333; border-radius: 10px; color: #fff; font-family: inherit; font-size: 1rem; }
        button.save-btn { width: 100%; background: #00ffff; color: #000; border: none; padding: 15px; font-weight: 800; border-radius: 10px; cursor: pointer; font-size: 1.1rem; }
        .alert { background: rgba(0,255,128,0.2); color: #00ff80; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h1>Stúdió Vezérlő</h1>
        <div id="status-msg"></div>

        <!-- SZAVAZÁS INDÍTÓ -->
        <div class="admin-vote-box">
            <h3 style="color: #00ff80; margin-bottom: 10px;">📊 Közönség Szavazás</h3>
            <button class="start-vote-btn" onclick="startAdminVote()">Szavazás indítása a vendégeknél</button>
        </div>

        <div class="form-group">
            <label>Dal kiválasztása:</label>
            <select id="edit-select"><option value="">+ Új dal rögzítése</option></select>
        </div>

        <form id="song-form" action="/api/upload" method="POST">
            <input type="hidden" id="song-id" name="songId" value="">
            <div class="form-group">
                <label>Dal Címe</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label>Előadó</label>
                <input type="text" id="artist" name="artist" required>
            </div>
            <div class="form-group">
                <label>YouTube Link</label>
                <input type="text" id="youtubeUrl" name="youtubeUrl" required>
            </div>
            <div class="form-group">
                <label>Szöveg</label>
                <textarea id="lyrics" name="lyrics"></textarea>
            </div>
            <button type="submit" class="save-btn" id="submit-btn">Mentés</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Szavazás indítása az admin gombbal
        function startAdminVote() {
            socket.emit('admin-start-voting');
            alert("A szavazás megnyitva a vendégek telefonjain!");
        }

        // --- (A dalbetöltő és szerkesztő logikád marad ugyanaz) ---
        let allSongs = [];
        async function load() {
            const res = await fetch('/api/songs');
            allSongs = await res.json();
            const select = document.getElementById('edit-select');
            allSongs.forEach(song => {
                const opt = document.createElement('option');
                opt.value = song.id; 
                opt.textContent = `${song.artist} - ${song.title}`;
                select.appendChild(opt);
            });
        }
        load();
    </script>
</body>
</html>
