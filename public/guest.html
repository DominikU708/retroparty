<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroParty - Vendég Távirányító</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00ffff; --bg: #050505; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: #fff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px; }

        /* FELSŐ FEJLÉC */
        .header { text-align: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { font-size: 1.5rem; font-weight: 800; color: var(--accent); text-transform: uppercase; text-shadow: 0 0 15px var(--accent); letter-spacing: 2px; }
        .header p { font-size: 0.85rem; color: #aaa; margin-top: 5px; }

        /* KÁRTYA ALAPOK */
        .card { background: rgba(20, 20, 25, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; color: #fff; display: flex; align-items: center; gap: 8px; }

        /* 1. ÉLŐ MOST SZÓL KÁRTYA */
        .now-playing-box { background: linear-gradient(135deg, rgba(0,255,255,0.1), rgba(0,0,0,0.4)); border: 1px solid rgba(0,255,255,0.3); border-radius: 16px; padding: 15px; text-align: center; box-shadow: 0 0 20px rgba(0,255,255,0.15); }
        .np-label { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        .np-title { font-size: 1.1rem; font-weight: 800; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .np-artist { font-size: 0.85rem; color: #aaa; margin-top: 2px; }

        /* EMOJI KÜLDŐ PANEL */
        .emoji-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .emoji-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; font-size: 1.8rem; padding: 12px 0; cursor: pointer; transition: 0.2s; }
        .emoji-btn:active { transform: scale(0.9); background: rgba(0,255,255,0.2); border-color: var(--accent); }

        /* SZAVAZÓ PANEL */
        .vote-row { display: flex; gap: 15px; }
        .vote-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 15px; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .vote-btn.good:active { background: rgba(0,255,128,0.2); border-color: #00ff80; color: #00ff80; }
        .vote-btn.bad:active { background: rgba(255,0,85,0.2); border-color: #ff0055; color: #ff0055; }

        /* 3. ÜZENETFAL MEZŐ */
        .message-box { display: flex; gap: 10px; }
        .msg-input { flex-grow: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: #fff; font-family: inherit; font-size: 0.95rem; outline: none; }
        .msg-input:focus { border-color: var(--accent); }
        .send-msg-btn { background: var(--accent); color: #000; border: none; padding: 0 16px; font-weight: 700; border-radius: 12px; cursor: pointer; }

        /* 4. SOUNDBOARD (HANGEFFEKTEK) */
        .sound-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .sound-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 5px; color: #fff; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; text-align: center; }
        .sound-btn:active { background: rgba(255,255,0,0.2); border-color: #ffff00; transform: scale(0.95); }

        /* DALKERESŐ ÉS KÉRÉSEK */
        .search-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: #fff; font-family: inherit; font-size: 1rem; outline: none; transition: 0.3s; margin-bottom: 12px; }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,255,255,0.2); }

        .song-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .song-list::-webkit-scrollbar { width: 4px; }
        .song-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .song-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .song-item:active { background: rgba(0,255,255,0.1); }
        .song-info { display: flex; flex-direction: column; gap: 4px; text-align: left; overflow: hidden; padding-right: 10px; }
        .song-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 0.8rem; color: #aaa; }

        .request-btn { background: var(--accent); color: #000; border: none; padding: 8px 14px; font-weight: 700; font-size: 0.85rem; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .request-btn:active { transform: scale(0.95); opacity: 0.8; }

        /* VISSZAJELZŐ TOAST */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,255,255,0.2); backdrop-filter: blur(15px); border: 1px solid var(--accent); color: #fff; padding: 12px 25px; border-radius: 30px; font-weight: 700; font-size: 0.9rem; box-shadow: 0 10px 30px rgba(0,255,255,0.3); transition: 0.3s; z-index: 100; pointer-events: none; }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>RetroParty Remote</h1>
            <p>Vezéreld a bulit a zsebedből!</p>
        </div>

        <!-- 1. ÉLŐ MOST SZÓL KÁRTYA -->
        <div class="now-playing-box">
            <div class="np-label">⚡ Most szól a buliban ⚡</div>
            <div class="np-title" id="np-title">Betöltés...</div>
            <div class="np-artist" id="np-artist">Várj egy pillanatot</div>
        </div>

        <!-- EMOJI KÜLDÉS -->
        <div class="card">
            <h3>🔥 Reakció küldése</h3>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="sendEmoji('❤️')">❤️</button>
                <button class="emoji-btn" onclick="sendEmoji('✨')">✨</button>
                <button class="emoji-btn" onclick="sendEmoji('🎸')">🎸</button>
                <button class="emoji-btn" onclick="sendEmoji('🎉')">🎉</button>
                <button class="emoji-btn" onclick="sendEmoji('💀')">💀</button>
                <button class="emoji-btn" onclick="sendEmoji('🌹')">🌹</button>
                <button class="emoji-btn" onclick="sendEmoji('🚀')">🚀</button>
            </div>
        </div>

        <!-- SZAVAZÁS -->
        <div class="card">
            <h3>📊 Party Szavazás</h3>
            <div class="vote-row">
                <button class="vote-btn good" onclick="sendVote('good')">🔥 Zseniális</button>
                <button class="vote-btn bad" onclick="sendVote('bad')">💀 Gyenge</button>
            </div>
        </div>

        <!-- 3. ÉLŐ ÜZENETFAL / KÖSZÖNTŐ -->
        <div class="card">
            <h3>💬 Üzenet a kivetítőre</h3>
            <div class="message-box">
                <input type="text" class="msg-input" id="msg-input" placeholder="Írj be egy poént vagy üzenetet..." maxlength="60">
                <button class="send-msg-btn" onclick="sendMessage()">Küldés</button>
            </div>
        </div>

        <!-- 4. SOUNDBOARD (HANGEFFEKTEK) -->
        <div class="card">
            <h3>🎛️ Bulis Hangeffektek</h3>
            <div class="sound-grid">
                <button class="sound-btn" onclick="playSound('airhorn')">📯 Légkürt</button>
                <button class="sound-btn" onclick="playSound('cheer')">👏 Taps</button>
                <button class="sound-btn" onclick="playSound('vinyl')">🪩 Lemez</button>
            </div>
        </div>

        <!-- DAL KÉRÉSE / VÁRÓLISTA -->
        <div class="card">
            <h3>🎵 Dal Kérése</h3>
            <input type="text" class="search-input" id="search-box" placeholder="Keresés előadó vagy cím alapján...">
            <div class="song-list" id="song-list">
                <!-- Itt betöltődnek a dalok -->
            </div>
        </div>
    </div>

    <div id="toast">Művelet sikeres!</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let allSongs = [];

        function showToast(text) {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // 1. Frissítjük a Most szól kártyát lekérdezéssel
        async function updateNowPlaying() {
            try {
                const res = await fetch('/api/current-song');
                const song = await res.json();
                document.getElementById('np-title').textContent = song.title || 'Ismeretlen';
                document.getElementById('np-artist').textContent = song.artist || 'Ismeretlen előadó';
            } catch(e) {}
        }
        setInterval(updateNowPlaying, 3000);
        updateNowPlaying();

        function sendEmoji(emoji) {
            socket.emit('send-emoji', emoji);
            showToast(`${emoji} Reakció elküldve!`);
        }

        function sendVote(type) {
            socket.emit('send-vote', type);
            showToast(type === 'good' ? '🔥 Szavazat: Zseniális!' : '💀 Szavazat: Gyenge!');
        }

        // 3. Üzenet küldése a kivetítőre
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;
            socket.emit('send-message', text);
            input.value = '';
            showToast('💬 Üzenet elküldve a kivetítőre!');
        }

        // 4. Hangeffekt triggerezés
        function playSound(soundType) {
            socket.emit('play-sound', soundType);
            showToast('🎛️ Effektszűrő lejátszva!');
        }

        async function loadSongs() {
            try {
                const res = await fetch('/api/songs');
                allSongs = await res.json();
                renderSongList(allSongs);
            } catch (e) {}
        }

        function renderSongList(songs) {
            const listContainer = document.getElementById('song-list');
            listContainer.innerHTML = '';

            if (songs.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color:#777; padding:15px;">Nincs találat.</div>';
                return;
            }

            songs.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';
                item.innerHTML = `
                    <div class="song-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist}</div>
                    </div>
                    <button class="request-btn" onclick="requestSong('${song.id}')">+ Kérés</button>
                `;
                listContainer.appendChild(item);
            });
        }

        function requestSong(songId) {
            const song = allSongs.find(s => s.id === songId);
            if (song) {
                const requesterName = prompt("Add meg a neved (vagy hagyhatod üresen):", "Vendég") || "Vendég";
                socket.emit('request-song', {
                    title: song.title,
                    artist: song.artist,
                    youtubeId: song.youtubeId,
                    requester: requesterName
                });
                showToast(`Dal beküldve: ${song.title}`);
            }
        }

        document.getElementById('search-box').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allSongs.filter(s => 
                s.title.toLowerCase().includes(term) || 
                s.artist.toLowerCase().includes(term)
            );
            renderSongList(filtered);
        });

        loadSongs();
    </script>
</body>
</html>
