<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroParty Ultimate Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00ffff; --text-size: 3rem; --text-size-active: 4.5rem; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; transition: background-color 1s ease; }
        
        #yt-bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; opacity: 0.15; filter: blur(50px); pointer-events: none; transition: 1s; }

        .header-bar { position: absolute; top: 0; left: 0; width: 100%; padding: 25px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 50; opacity: 0.4; transition: 0.3s; }
        .header-bar:hover { opacity: 1; }
        .song-title-display { font-size: 1.6rem; font-weight: 700; color: var(--accent); text-transform: uppercase; text-shadow: 0 0 15px var(--accent); transition: 0.5s; }

        /* QR KÓD DOBOZ */
        .qr-box { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 2px solid rgba(0, 255, 255, 0.4); border-radius: 16px; padding: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(0,255,255,0.3); width: 130px; height: 130px; }
        .qr-box:hover { border-color: var(--accent); transform: scale(1.05); }
        .qr-box img { width: 110px !important; height: 110px !important; border-radius: 6px; display: block; background: #fff; padding: 4px; }

        .lyrics-wrapper { 
            flex-grow: 1; overflow-y: auto; position: relative; scroll-behavior: smooth; 
            padding: 40vh 5vw; text-align: center; z-index: 20;
            will-change: scroll-position;
        }
        .lyrics-wrapper::-webkit-scrollbar { display: none; }

        /* ABSZOLÚT VAJSIMA ÉS AKADÁLYMENTES SORSTÍLUS */
        .lyric-line { 
            padding: 18px 0; 
            font-size: var(--text-size); 
            font-weight: 700; 
            color: rgba(255,255,255,0.3); 
            transition: color 0.25s ease, transform 0.25s ease, font-size 0.25s ease; 
            transform-origin: center; 
            max-width: 90vw; 
            margin: 0 auto; 
            line-height: 1.3; 
            will-change: transform, color;
        }
        .lyric-line.active { 
            color: #ffffff !important; 
            font-size: var(--text-size-active); 
            font-weight: 800; 
            transform: scale(1.05); 
            text-shadow: 0 0 35px var(--accent); 
        }
        .lyric-line.static-text { 
            color: #ffffff; 
            font-size: var(--text-size); 
            margin-bottom: 25px; 
        }

        #emoji-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; overflow: hidden; }
        .floating-emoji { position: absolute; bottom: -50px; font-size: 2.5rem; animation: floatUp 3s linear forwards; will-change: transform, opacity; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } }

        #queue-toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(0,255,255,0.15); backdrop-filter: blur(15px); border: 1px solid var(--accent); border-radius: 30px; padding: 12px 25px; z-index: 60; font-weight: 700; color: #fff; box-shadow: 0 10px 30px rgba(0,255,255,0.3); transition: 0.4s; }
        #queue-toast.show { transform: translateX(-50%) translateY(0); }

        .custom-controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 900px; background: rgba(15,15,20,0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); border-radius: 50px; padding: 15px 30px; display: flex; align-items: center; gap: 20px; z-index: 50; transition: 0.5s; }
        body.idle .custom-controls { opacity: 0; transform: translate(-50%, 20px); pointer-events: none; }

        .btn { background: transparent; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; font-weight: 600; font-size: 1rem; transition: 0.2s; }
        .btn:hover { color: var(--accent); }
        .btn svg { width: 24px; height: 24px; fill: currentColor; }
        .play-btn { background: #fff; color: #000; width: 50px; height: 50px; border-radius: 50%; justify-content: center; }
        .play-btn:hover { background: var(--accent); }

        .progress-container { flex-grow: 1; display: flex; align-items: center; gap: 15px; font-size: 0.9rem; }
        .progress-bar { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 5px; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); z-index: 100; display: none; justify-content: center; align-items: center; }
        .modal.open { display: flex; }
        .modal-content { background: #111; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; text-align: center; }
        .close-btn { float: right; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .search-input { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #222; color: #fff; margin-bottom: 15px; font-family: inherit; font-size: 1rem; outline: none; text-align: left; }
        .search-input:focus { border: 1px solid var(--accent); }
        .song-item { padding: 15px; border-bottom: 1px solid #333; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .song-item:hover { background: rgba(255,255,255,0.05); color: var(--accent); }

        .volume-box { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #aaa; }
        .volume-slider { width: 70px; height: 5px; -webkit-appearance: none; background: rgba(255,255,255,0.2); border-radius: 3px; outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }

        #xfactor-result-modal { background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 200; display: none; justify-content: center; align-items: center; }
        #xfactor-result-modal.open { display: flex; }
        .xfactor-card { background: linear-gradient(135deg, #111118, #1a1a26); border: 2px solid var(--accent); border-radius: 30px; padding: 50px; width: 90%; max-width: 600px; text-align: center; box-shadow: 0 0 80px rgba(0,255,255,0.4); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .xfactor-grid { display: flex; gap: 20px; margin-top: 30px; }
        .xfactor-option { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 30px; flex: 1; border: 2px solid rgba(255,255,255,0.1); }
        .xfactor-option.winner { border-color: #00ff80; background: rgba(0,255,128,0.1); box-shadow: 0 0 30px rgba(0,255,128,0.3); }
        .xfactor-option h3 { font-size: 3rem; margin-bottom: 10px; }
        .xfactor-option .count { font-size: 2.5rem; font-weight: 800; color: #fff; }
    </style>
</head>
<body>

    <div id="yt-bg-container"><div id="youtube-player"></div></div>
    <div id="emoji-layer"></div>
    <div id="queue-toast">Új dal a várólistán!</div>

    <div class="header-bar">
        <div class="song-title-display" id="song-info">Válassz dalt...</div>
        <div class="qr-box" onclick="openModal('qr-modal')" title="Kattints a nagyításhoz">
            <img id="qr-img" src="" alt="QR">
        </div>
    </div>

    <div class="lyrics-wrapper" id="lyrics-container">
        <div class="lyric-line active">Készenlétben</div>
        <div class="lyric-line">Nyisd meg a playlistet lent!</div>
    </div>

    <div class="custom-controls" id="control-bar">
        <button class="btn" onclick="openModal('playlist-modal')">Playlist</button>
        <button class="play-btn" id="play-btn">
            <svg id="icon-play" viewBox="0 0 24 24" style="margin-left: 3px;"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <div class="progress-container">
            <span id="time-current">0:00</span>
            <input type="range" class="progress-bar" id="seek-bar" value="0" step="0.5" min="0" max="100">
            <span id="time-total">0:00</span>
        </div>
        <div class="volume-box">
            <span>🔊</span>
            <input type="range" class="volume-slider" id="volume-bar" min="0" max="100" value="80">
        </div>
        <button class="btn" onclick="toggleFullscreen()">Teljes Képernyő</button>
    </div>

    <div class="modal" id="playlist-modal">
        <div class="modal-content" style="text-align: left;">
            <button class="close-btn" onclick="closeModal('playlist-modal')">✖</button>
            <h2 style="color:var(--accent); margin-bottom:15px;">Dalválasztó & Várólista</h2>
            <div id="queue-section" style="margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:15px;">
                <h4 style="color:#aaa; font-size:0.9rem; margin-bottom:8px;">Várólista (Kérések):</h4>
                <div id="queue-list" style="font-size:0.9rem; color:var(--accent);">Üres a várólista.</div>
            </div>
            <input type="text" class="search-input" id="search-box" placeholder="Keresés...">
            <div id="playlist-list"></div>
        </div>
    </div>

    <div class="modal" id="qr-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('qr-modal')">✖</button>
            <h2 style="color:var(--accent); margin-bottom:15px;">Irányítsd a telefonodról!</h2>
            <div style="display:inline-block; background:#fff; padding:15px; border-radius:15px; margin-bottom:15px;">
                <img id="qr-img-large" src="" alt="Nagy QR" style="width:200px; height:200px; display:block;">
            </div>
            <p style="color:#aaa; font-size:0.9rem;" id="guest-url-text"></p>
        </div>
    </div>

    <div class="modal" id="xfactor-result-modal">
        <div class="xfactor-card">
            <h1 style="color:var(--accent); font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px;">Szavazás Eredménye</h1>
            <p style="color: #aaa; margin-top: 10px; font-size: 1.1rem;">Így döntött a közönség a stüdióban:</p>
            <div class="xfactor-grid">
                <div class="xfactor-option" id="res-good-box">
                    <h3>🔥</h3>
                    <div class="count" id="res-good">0</div>
                    <p style="margin-top: 10px; color:#aaa;">Zseniális</p>
                </div>
                <div class="xfactor-option" id="res-bad-box">
                    <h3>💀</h3>
                    <div class="count" id="res-bad">0</div>
                    <p style="margin-top: 10px; color:#aaa;">Gyenge</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const socket = io();
        let player = null;
        let currentLyrics = [];
        let isSynced = false;
        let allSongs = [];
        let songQueue = [];
        let staticScrollInterval = null;
        let votes = { good: 0, bad: 0 };
        let isVotingActive = false;
        let lastActiveIndex = -1;
        let timeCheckInterval = null;

        const guestUrl = "https://retro-party.onrender.com/guest.html";

        try {
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(guestUrl)}`;
            document.getElementById("qr-img").src = qrApiUrl;
            document.getElementById("qr-img-large").src = qrApiUrl;
            document.getElementById('guest-url-text').textContent = guestUrl;
        } catch(e) {
            console.error("QR kód hiba:", e);
        }

        socket.on('add-to-queue', (song) => {
            songQueue.push(song);
            updateQueueUI();
            showToast(`Új kérés: ${song.title} (${song.requester || 'Vendég'})`);
        });

        socket.on('float-emoji', (emoji) => {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.textContent = emoji;
            el.style.left = Math.random() * 80 + 10 + 'vw';
            document.getElementById('emoji-layer').appendChild(el);
            setTimeout(() => el.remove(), 3000);
        });

        socket.on('update-vote', (type) => {
            if(isVotingActive) {
                votes[type]++;
            }
        });

        function showToast(text) {
            const t = document.getElementById('queue-toast');
            t.textContent = text;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 4000);
        }

        function updateQueueUI() {
            const qList = document.getElementById('queue-list');
            if(songQueue.length === 0) {
                qList.innerHTML = 'Üres a várólista.';
                return;
            }
            qList.innerHTML = '';
            songQueue.forEach((s, idx) => {
                const d = document.createElement('div');
                d.style.padding = '5px 0';
                d.innerHTML = `${idx+1}. <strong>${s.title}</strong> <span style="color:#aaa; font-size:0.8rem;">(Kérte: ${s.requester || 'Vendég'})</span>`;
                qList.appendChild(d);
            });
        }

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { 'controls': 0, 'disablekb': 1, 'fs': 0, 'rel': 0, 'playsinline': 1 },
                events: {
                    'onReady': () => { 
                        player.setVolume(80);
                        loadSongList().then(() => {
                            if (allSongs.length > 0) {
                                selectSong(allSongs[0]);
                            }
                        }); 
                    }
                }
            });
        };

        const volumeBar = document.getElementById('volume-bar');
        volumeBar.addEventListener('input', (e) => {
            const vol = parseInt(e.target.value);
            if (player && typeof player.setVolume === 'function') {
                player.setVolume(vol);
            }
        });

        function startLyricsChecker() {
            if (timeCheckInterval) clearInterval(timeCheckInterval);
            timeCheckInterval = setInterval(() => {
                if (player && typeof player.getPlayerState === 'function') {
                    try {
                        const state = player.getPlayerState();
                        if (state === 1) {
                            document.getElementById('icon-play').style.display = 'none';
                            document.getElementById('icon-pause').style.display = 'block';
                            
                            const currentTime = player.getCurrentTime() || 0;
                            const duration = player.getDuration() || 0;
                            
                            if (duration > 0) {
                                document.getElementById('seek-bar').max = duration;
                                document.getElementById('time-total').textContent = formatTime(duration);
                            }
                            document.getElementById('seek-bar').value = currentTime;
                            document.getElementById('time-current').textContent = formatTime(currentTime);

                            if (isSynced && currentLyrics.length > 0) {
                                let activeIndex = -1;
                                for (let i = 0; i < currentLyrics.length; i++) {
                                    if (currentTime >= currentLyrics[i].time) activeIndex = i;
                                    else break;
                                }
                                if (activeIndex !== -1 && activeIndex !== lastActiveIndex) {
                                    lastActiveIndex = activeIndex;
                                    document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
                                    const activeElement = document.getElementById('line-' + activeIndex);
                                    if (activeElement) {
                                        activeElement.classList.add('active');
                                        activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    }
                                }
                            }
                        } else if (state === 0) { 
                            if(!isVotingActive && !document.getElementById('xfactor-result-modal').classList.contains('open')) {
                                startSongEndingVote();
                            }
                        } else {
                            document.getElementById('icon-play').style.display = 'block';
                            document.getElementById('icon-pause').style.display = 'none';
                        }
                    } catch(e) {}
                }
            }, 250);
        }

        startLyricsChecker();

        function startSongEndingVote() {
            isVotingActive = true;
            votes = { good: 0, bad: 0 };
            
            socket.emit('close-voting', { start: true });

            setTimeout(() => {
                isVotingActive = false;
                
                document.getElementById('res-good').textContent = votes.good;
                document.getElementById('res-bad').textContent = votes.bad;

                const goodBox = document.getElementById('res-good-box');
                const badBox = document.getElementById('res-bad-box');
                goodBox.classList.remove('winner');
                badBox.classList.remove('winner');

                if (votes.good >= votes.bad) {
                    goodBox.classList.add('winner');
                } else {
                    badBox.classList.add('winner');
                }

                openModal('xfactor-result-modal');

                setTimeout(() => {
                    closeModal('xfactor-result-modal');
                    playNextSongLogic();
                }, 5000);

            }, 30000);
        }

        function playNextSongLogic() {
            if(staticScrollInterval) clearInterval(staticScrollInterval);
            
            if(songQueue.length > 0) {
                const nextSong = songQueue.shift();
                updateQueueUI();
                selectSong(nextSong);
            } else if(allSongs.length > 0) {
                const randomIndex = Math.floor(Math.random() * allSongs.length);
                selectSong(allSongs[randomIndex]);
            }
        }

        document.getElementById('seek-bar').addEventListener('input', (e) => {
            if (player && typeof player.seekTo === 'function') player.seekTo(parseFloat(e.target.value), true);
        });
        
        document.getElementById('play-btn').addEventListener('click', () => {
            if (player && typeof player.getPlayerState === 'function') {
                const state = player.getPlayerState();
                if (state === 1) player.pauseVideo();
                else player.playVideo();
            }
        });

        async function loadSongList() {
            try {
                const res = await fetch('/api/songs');
                allSongs = await res.json();
                renderPlaylist(allSongs);
            } catch (err) { console.error(err); }
        }

        function renderPlaylist(songs) {
            const list = document.getElementById('playlist-list');
            list.innerHTML = '';
            songs.forEach(song => {
                const div = document.createElement('div');
                div.className = 'song-item';
                div.innerHTML = `<span><strong>${song.artist}</strong> - ${song.title}</span> <button class="btn" style="background:#222; padding:5px 10px; border-radius:8px;" onclick="event.stopPropagation(); addToQueueDirect('${song.id}')">+ Kérés</button>`;
                div.onclick = () => { selectSong(song); closeModal('playlist-modal'); };
                list.appendChild(div);
            });
        }

        function addToQueueDirect(id) {
            const song = allSongs.find(s => s.id === id);
            if(song) {
                songQueue.push({...song, requester: 'Admin'});
                updateQueueUI();
                showToast(`Hozzáadva a várólistához: ${song.title}`);
            }
        }

        document.getElementById('search-box').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderPlaylist(allSongs.filter(s => s.title.toLowerCase().includes(term) || s.artist.toLowerCase().includes(term)));
        });

        function selectSong(song) {
            if(staticScrollInterval) clearInterval(staticScrollInterval);
            lastActiveIndex = -1;

            document.getElementById('song-info').textContent = `${song.artist} - ${song.title}`;

            if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(song.youtubeId);
                player.playVideo();
            }

            fetch('/api/update-current-song', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: song.title, artist: song.artist })
            }).catch(() => {});
            
            const container = document.getElementById('lyrics-container');
            container.innerHTML = '';
            if (!song.lyrics || !song.lyrics.trim()) {
                container.innerHTML = '<div class="lyric-line active">Ehhez a dalhoz nincs megadva dalszöveg.</div>';
                return;
            }

            const lines = song.lyrics.split('\n');
            const lrcRegex = /\[(\d{1,2}):(\d{1,2}(?:[\.:]\d{1,3})?)\](.*)/;
            let hasValidLRC = lines.some(l => lrcRegex.test(l));

            if (hasValidLRC) {
                isSynced = true;
                currentLyrics = [];
                lines.forEach(line => {
                    const match = lrcRegex.exec(line);
                    if (match) {
                        let sec = match[2].replace(':', '.');
                        currentLyrics.push({ time: parseInt(match[1]) * 60 + parseFloat(sec), text: match[3].trim() });
                    }
                });
                currentLyrics.forEach((line, index) => {
                    const db = document.createElement('div');
                    db.className = 'lyric-line';
                    db.id = 'line-' + index;
                    db.textContent = line.text;
                    container.appendChild(db);
                });
            } else {
                isSynced = false;
                lines.forEach(line => {
                    if(line.trim()) {
                        const db = document.createElement('div');
                        db.className = 'lyric-line static-text';
                        db.textContent = line;
                        container.appendChild(db);
                    }
                });

                setTimeout(() => {
                    let scrollPos = 0;
                    staticScrollInterval = setInterval(() => {
                        if(container) {
                            scrollPos += 1;
                            container.scrollTop = scrollPos;
                            if(container.scrollTop + container.clientHeight >= container.scrollHeight) {
                                clearInterval(staticScrollInterval);
                            }
                        }
                    }, 80);
                }, 1000);
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            return `${Math.floor(seconds / 60)}:${Math.floor(seconds % 60) < 10 ? '0' : ''}${Math.floor(seconds % 60)}`;
        }

        function openModal(id) { document.getElementById(id).classList.add('open'); }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }
        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        let idleTimer;
        window.addEventListener('mousemove', () => {
            document.body.classList.remove('idle');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
        });
    </script>
</body>
</html>
